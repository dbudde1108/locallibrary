[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locallibrary"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "channels-redis>=4.3.0",
    "channels[daphne]>=4.3.2",
    "django>=6.1.1",
    "django-environ>=0.14.0",
]

[tool.setuptools]
packages = ["locallibrary_config"]

[dependency-groups]
dev = [
    "pylint-django>=2.8.0",
]
